[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "see-think-build"
version = "0.4.1"
description = "STB — See, Think, Build: runtime UI maps for Android & native apps, bridged to static RE, with clone scaffold + round-trip verify"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kian1904"}]
keywords = ["android", "reverse-engineering", "mcp", "jadx", "uiautomator", "apk"]
dependencies = [
    "mcp>=1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
stb-see = "stb.cli:see"
stb-dissect = "stb.cli:dissect"
stb-think = "stb.cli:think"
stb-build = "stb.cli:build"
stb-validate = "stb.cli:validate"
stb-server = "stb.cli:server"
stb-scan = "stb.cli:scan"
stb-appmap = "stb.cli:appmap"
stb-clone = "stb.cli:clone"
stb-scaffold = "stb.cli:scaffold"
stb-verify = "stb.cli:verify"
stb-see-native = "stb.cli:see_native"
stb-bridge-native = "stb.cli:bridge_native"
stb-canvas = "stb.cli:canvas"
stb-see-native-win = "stb.cli:see_native_win"
stb-see-native-mac = "stb.cli:see_native_mac"
stb-preflight = "stb.cli:preflight"

[project.urls]
Repository = "https://github.com/Kian1904/stb"

[tool.setuptools]
packages = ["stb"]
py-modules = []
